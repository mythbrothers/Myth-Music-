name: Build MYTH Music APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          set +o pipefail
          yes | "$SDKMANAGER" --licenses > /tmp/sdk-licenses.log 2>&1
          RESULT=$?
          set -o pipefail

          tail -n 30 /tmp/sdk-licenses.log

          if [ "$RESULT" -ne 0 ] && \
             ! grep -q "All SDK package licenses accepted" /tmp/sdk-licenses.log; then
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create Android Debug Keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          ls -l "$HOME/.android/debug.keystore"

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Build MYTH Music Debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace --no-daemon

      - name: Upload MYTH Music APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MYTH-Music-Crystal-Glass-APK
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 30
