name: Import MYTH Music source ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          archive = pathlib.Path('MYTH_Music_GitHub_Source_Package.zip')
          if not archive.is_file():
              raise SystemExit('ZIP file not found in repository root')
          root = pathlib.Path.cwd().resolve()
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = pathlib.PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit('Unsafe ZIP entry')
                  target = (root / str(path)).resolve()
                  if not target.is_relative_to(root):
                      raise SystemExit('Unsafe destination')
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with z.open(item) as src, open(target, 'wb') as dst:
                          import shutil
                          shutil.copyfileobj(src, dst)
          PY
          chmod +x gradlew || true
          rm -f MYTH_Music_GitHub_Source_Package.zip

      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Import MYTH Music source'
            git push
          fi
  
