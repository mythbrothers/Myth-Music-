
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git rm -r --cached --ignore-unmatch .github/workflows/android-build.yml
          git add -A

          git reset -- .github/workflows/android-build.yml || true

          if ! git diff --cached --quiet; then
            git commit -m 'Import MYTH Music source'
            git push
          fi
          
